name: do_bazy
description: "Safe Path — an Android neighborhood game built with Flutter and Flame."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
  assets:
    - assets/maps/tauron-arena.geojson
    - assets/audio/mission01/
    - assets/illustrations/
